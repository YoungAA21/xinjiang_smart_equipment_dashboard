worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/xml+rss image/jpeg image/gif image/png image/svg+xml;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.";

    # Existing soundvoice site: preserve its paths and 18080 proxy behavior.
    server {
        listen 8080;
        server_name localhost;
        charset utf-8;

        location / {
            root C:/soundvoice-service/dist;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://localhost:18080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
            root C:/soundvoice-service/dist;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        error_page 404 /404.html;
        location = /404.html {
            root C:/soundvoice-service/dist;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root D:/nginx/nginx-1.24.0/html;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(git|svn|htaccess|htpasswd|ini|log|sh|bash)$ {
            deny all;
        }
    }

    # Equipment dashboard: same-origin 5158 routes and existing 18080 APIs.
    server {
        listen 80;
        server_name localhost;
        charset utf-8;

        root D:/nginx/nginx-1.24.0/html/health/dist;
        index index.html index.htm;

        # Allow slow history queries up to 120 seconds.
        location = /_telemetry-api/api/telemetry/history {
            rewrite ^/_telemetry-api(/api/.*)$ $1 break;
            proxy_pass http://127.0.0.1:5158;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_cache off;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            add_header Cache-Control "no-store" always;
            proxy_intercept_errors off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 120s;

            limit_except GET {
                deny all;
            }
        }

        # Read-only 5158 API allowlist. The public prefixes are removed before proxying.
        location ~ ^/(?:_health-api/api/health(?:/detail|/table-maintenance)?|_telemetry-api/api/(?:configuration/modules(?:/[^/]+/points)?|realtime/latest|telemetry/history)|_alarm-api/api/analysis/(?:alarms|status)|_analysis-api/api/analysis/(?:daily-limit-trends|trend-insights|trend-alarms))$ {
            rewrite ^/_[^/]+(/api/.*)$ $1 break;
            proxy_pass http://127.0.0.1:5158;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_cache off;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            add_header Cache-Control "no-store" always;
            proxy_intercept_errors off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;

            limit_except GET {
                deny all;
            }
        }

        # Unknown dedicated API routes must never fall back to index.html.
        location ~ ^/_(?:health|telemetry|alarm|analysis)-api(?:/|$) {
            return 404;
        }

        # These APIs belong to 18080, not 5158. Preserve the full URI.
        location ~ ^/(api|auth|monitor|alarm|collectorManagement|recordings)(/|$) {
            proxy_pass http://localhost:18080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # Preserve the previous /telemetry/ mapping for compatibility.
        location ~ ^/telemetry/ {
            proxy_pass http://localhost:5158;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(git|svn|htaccess|htpasswd|ini|log|sh|bash)$ {
            deny all;
        }
    }
}
