# Nginx merged configuration (Windows / nginx 1.24.x)
# Baseline: nginx-ok.conf (known working configuration).
# Enhancements: nginx.conf (SoundVoice WebSocket/media/upload/cache/security).
# CORS: wildcard origin for non-cookie browser requests; API OPTIONS handled by Nginx.
#
# IMPORTANT: keep existing listening ports and distinct frontend directories:
#   http://HOST:80/     -> Equipment Health frontend + 5158/18080 backends
#   http://HOST:8080/   -> SoundVoice frontend + 18080 backend
#
# Use this file as D:/nginx/nginx-1.24.0/conf/nginx.conf (adjust if needed).

worker_processes 1;  # Keep the known-good Windows worker setting.

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    charset utf-8;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time urt=$upstream_response_time';
    access_log logs/access.log main;
    error_log logs/error.log warn;

    server_tokens off;
    sendfile on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 4096;

    # Large audio/model/OTA uploads and long-lived streaming operations.
    client_max_body_size 1024m;
    client_body_buffer_size 1m;
    client_body_timeout 120s;
    send_timeout 120s;

    # Only send the WebSocket Upgrade header for an actual Upgrade request.
    # The empty value also permits upstream HTTP/1.1 keepalive otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    # Compress text formats only; do not re-compress audio and image content.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        application/javascript
        application/json
        application/manifest+json
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    upstream soundvoice_backend {
        server 127.0.0.1:18080;
        keepalive 32;
    }

    upstream equipment_backend {
        server 127.0.0.1:5158;
        keepalive 16;
    }

    # ================================================================
    # 8080: SoundVoice site (retained from nginx-ok.conf)
    # ================================================================
    server {
        listen 8080;
        server_name localhost;
        root C:/soundvoice-service/dist;
        index index.html index.htm;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), geolocation=(), payment=()" always;

        # Runtime config must not be cached between releases.
        location = /config.js {
            try_files /config.js =404;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Important: 8080 /api/ REMOVES /api/ before sending to 18080.
        # Example: /api/ws/audio -> http://127.0.0.1:18080/ws/audio
        location ^~ /api/ {

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Disposition, Accept-Ranges, Content-Range, ETag" always;
            # Prevent conflicting duplicate CORS headers from the upstream.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;

            # Nginx responds to CORS preflight without forwarding to the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://soundvoice_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
        }

        location = /api {

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;

            # Nginx responds to CORS preflight without forwarding to the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            return 308 /api/;
        }

        # Historical backend responses may contain direct /media/... URLs.
        # Keep the original URI (no trailing slash in proxy_pass).
        location ^~ /media/ {

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Disposition, Accept-Ranges, Content-Range, ETag" always;
            # Prevent conflicting duplicate CORS headers from the upstream.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;

            # Nginx responds to CORS preflight without forwarding to the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://soundvoice_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Range $http_range;
            proxy_set_header If-Range $http_if_range;
            proxy_set_header Connection "";
            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
            proxy_force_ranges on;
        }

        # Security rules BEFORE regex-based static caching rules.
        location ~ /\.(?!well-known/) {
            deny all;
            access_log off;
            log_not_found off;
        }

        location ~* \.(git|svn|htaccess|htpasswd|ini|log|sh|bash)$ {
            deny all;
        }

        # Vite asset filenames contain content hashes (long cache life).
        location ~* ^/assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            access_log off;
        }

        # All other physical static files use short-term caching.
        location ~* \.(?:wasm|glb|gltf|bin|ico|png|jpe?g|gif|webp|svg|woff2?|ttf|otf|eot|css|js|map)$ {
            try_files $uri =404;
            expires 7d;
            add_header Cache-Control "public, max-age=604800" always;
            access_log off;
        }

        # Vue/Vite history-mode SPA fallback.
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        error_page 404 /404.html;
        location = /404.html {
            root C:/soundvoice-service/dist;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root D:/nginx/nginx-1.24.0/html;
        }
    }

    # ================================================================
    # 80: Equipment Health dashboard (retained from nginx-ok.conf)
    # ================================================================
    server {
        listen 80;
        server_name localhost;
        root D:/nginx/nginx-1.24.0/html/health/dist;
        index index.html index.htm;

        # Modbus point limits: forward PATCH to 5158; handle OPTIONS locally.
        # Keep this regex before the unknown-prefix rejection.
        location ~ ^/_telemetry-api/api/configuration/points/[0-9]+/limits$ {

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
            # Prevent conflicting duplicate CORS headers from the upstream.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;

            # Nginx responds to CORS preflight without forwarding to the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "PATCH, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            rewrite ^/_[^/]+(/api/.*)$ $1 break;
            proxy_pass http://equipment_backend;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:5158;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            proxy_cache off;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            add_header Cache-Control "no-store" always;
            proxy_intercept_errors off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;

            limit_except PATCH OPTIONS {
                deny all;
            }
        }

        # Shared monitoring configuration files on the collection backend (5158).
        location ^~ /_configuration-api/api/frontend-files/ {
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, PUT, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Content-Type, Accept, Cache-Control" always;
                return 204;
            }
            rewrite ^/_configuration-api(/api/.*)$ $1 break;
            proxy_pass http://equipment_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $proxy_host;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            proxy_cache off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "no-store" always;
            add_header Access-Control-Allow-Origin "*" always;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            client_max_body_size 5m;
            limit_except GET PUT OPTIONS { deny all; }
        }

        # Read-only 5158 allowlist. Strip the public _*-api prefix.
        # Keep this regex before the unknown-prefix rejection.
        location ~ ^/(?:_runtime-api/api/runtime-info/latest|_health-api/api/health(?:/detail|/table-maintenance)?|_telemetry-api/api/(?:configuration/modules(?:/[^/]+/points)?|realtime/latest|telemetry/history)|_alarm-api/api/analysis/(?:alarms|status)|_analysis-api/api/analysis/(?:daily-limit-trends|trend-insights|trend-alarms))$ {

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
            # Prevent conflicting duplicate CORS headers from the upstream.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;

            # Nginx responds to CORS preflight without forwarding to the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            rewrite ^/_[^/]+(/api/.*)$ $1 break;
            proxy_pass http://equipment_backend;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:5158;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization "";
            proxy_set_header Cookie "";
            proxy_set_header Connection "";
            proxy_cache off;
            proxy_hide_header ETag;
            proxy_hide_header Last-Modified;
            add_header Cache-Control "no-store" always;
            proxy_intercept_errors off;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;

            limit_except GET OPTIONS {
                deny all;
            }
        }

        # Reject unsupported special API routes; do not serve index.html.
        location ~ ^/_(?:health|telemetry|alarm|analysis|configuration)-api(?:/|$) {
            add_header Access-Control-Allow-Origin "*" always;
            return 404;
        }

        # Important: 80 retains the FULL URI for these 18080 endpoints.
        # Example: /api/foo -> http://127.0.0.1:18080/api/foo
        location ~ ^/(api|auth|monitor|alarm|collectorManagement|recordings)(/|$) {

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Disposition, Accept-Ranges, Content-Range, ETag" always;
            # Prevent conflicting duplicate CORS headers from the upstream.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;

            # Nginx responds to CORS preflight without forwarding to the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://soundvoice_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        # Keep the original /telemetry/* mapping to 5158 unchanged.
        location ~ ^/telemetry/ {

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
            # Prevent conflicting duplicate CORS headers from the upstream.
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Expose-Headers;
            proxy_hide_header Access-Control-Max-Age;

            # Nginx responds to CORS preflight without forwarding to the backend.
            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin "*" always;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, X-API-Key, X-CSRF-Token, X-Auth-Token, Origin, Accept, Cache-Control, Pragma, Range, If-Range" always;
                add_header Access-Control-Max-Age 86400 always;
                add_header Content-Length 0;
                return 204;
            }

            proxy_pass http://equipment_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        location ~ /\. {
            deny all;
        }

        location ~* \.(git|svn|htaccess|htpasswd|ini|log|sh|bash)$ {
            deny all;
        }

        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|map)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            internal;
            root D:/nginx/nginx-1.24.0/html;
        }
    }
}
